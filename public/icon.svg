<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#090A0D" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE169"/>
      <stop offset="50%" stop-color="#F5C518"/>
      <stop offset="100%" stop-color="#D49A00"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5C518" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F5C518" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#252A38" stroke-width="6"/>
  <circle cx="256" cy="256" r="180" fill="url(#glow)"/>

  <!-- Whisk Dual Lens / Overlapping Aperture Nodes -->
  <!-- Left Subject circle -->
  <circle cx="210" cy="235" r="95" fill="none" stroke="#4A5268" stroke-width="14" stroke-dasharray="12 8"/>
  <circle cx="210" cy="235" r="32" fill="#FFE169" opacity="0.9"/>
  
  <!-- Right Pose circle -->
  <circle cx="302" cy="277" r="95" fill="none" stroke="url(#gold)" stroke-width="16"/>
  <circle cx="302" cy="277" r="42" fill="none" stroke="url(#gold)" stroke-width="8"/>
  
  <!-- Central Spark / Transformation synthesis -->
  <path d="M256 160 Q256 210 210 210 Q256 210 256 260 Q256 210 302 210 Q256 210 256 160 Z" fill="url(#gold)"/>
  <circle cx="256" cy="256" r="16" fill="#FFFFFF"/>

  <!-- Banana Accent Sparkle -->
  <path d="M370 140 L380 165 L405 175 L380 185 L370 210 L360 185 L335 175 L360 165 Z" fill="url(#gold)"/>
  <path d="M130 350 L136 365 L151 371 L136 377 L130 392 L124 377 L109 371 L124 365 Z" fill="#FFE169" opacity="0.8"/>
</svg>
